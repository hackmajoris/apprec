name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - run: brew install xcodegen

      - run: make dist

      - name: Publish GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/AppRec.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/AppRec.zip --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(shasum -a 256 build/AppRec.zip | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/hackmajoris/homebrew-apps.git" tap
          sed -e '/^#/d' -e "s/\"__VERSION__\"/\"$version\"/" -e "s/\"__SHA256__\"/\"$sha\"/" \
            packaging/apprec.rb > tap/Casks/apprec.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/apprec.rb
          git commit -m "apprec $version"
          git push
